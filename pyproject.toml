[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-run-relay"
version = "0.1.5"
description = "Local-first AI task queue with quota-aware waiting and durable checkpoints"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
ai-run-relay = "relay.server:main"

[tool.setuptools.packages.find]
include = ["relay*"]

[tool.setuptools.package-data]
relay = ["static/*.html"]
